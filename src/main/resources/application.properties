spring.application.name=ForgetPassword-microService
server.port=8081

spring.datasource.url=jdbc:mysql://localhost:3306/forget_password?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=12345678

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Put your Gmail and App Password here to actually send email. Leave empty to print OTP in the console.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
